services:
  frontend:
    image: r4n0/cyber-front:latest
    command: npm run dev -- --host 0.0.0.0 --port 5173
    container_name: frontend

  backend:
    image: r4n0/cyber-back:latest
    command: ["sh","-c","python manage.py migrate && gunicorn --bind 0.0.0.0:8080 --workers 1 cyber.wsgi:application"]
    container_name: backend


  watchtower:
    image: nickfedor/watchtower:latest
    environment:
      -  WATCHTOWER_POLL_INTERVAL=600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:latest
    ports:
      - 8000:80
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf


volumes:
  node_modules:

services:
  frontend:
    build:
      context: cyber-front/
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173 --mode docker
    volumes:
      - ./cyber-front/:/usr/src/frontend/
      - node_modules:/usr/src/frontend/node_modules
    container_name: frontend

  backend:
    build:
      context:  cyber-back/
      dockerfile: Dockerfile
    command: ["sh","-c","python manage.py migrate && gunicorn --bind 0.0.0.0:8080 --workers 1 cyber.wsgi:application"]
    container_name: backend
    volumes:
      - ./cyber-back/:/app

  nginx:
    image: nginx:latest
    ports:
      - 8000:80
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf


volumes:
  node_modules:
